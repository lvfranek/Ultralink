# Runs on every push to main and on every pull request.
# Needs no secrets: the unit tests don't touch Supabase/Stripe, and the
# build works without environment variables.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only access to the repo is all this workflow needs
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Browser checks against the production build, in parallel with the job
  # above: Playwright E2E tests, then a Lighthouse audit that fails if a score
  # drops below the limits in lighthouserc.json.
  browser-tests:
    name: E2E + Lighthouse
    runs-on: ubuntu-latest
    env:
      # Placeholders, not secrets: the app needs *some* Supabase URL/key to
      # start, but public pages never contact Supabase for signed-out visitors.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Run Lighthouse CI
        run: npx -y @lhci/cli@0.15.1 autorun

      - name: Save Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports

      - name: Save Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
