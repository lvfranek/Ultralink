# Runs on every push to main and on every pull request.
# Needs no secrets: the unit tests don't touch Supabase/Stripe, and the
# build works without environment variables.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only access to the repo is all this workflow needs
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build (includes type checking)
        run: npm run build
